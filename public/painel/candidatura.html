<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Candidatura de teste · OperumData</title><link rel="stylesheet" href="painel.css"><script type="module" src="candidatura.js"></script></head><body><div class="environment">DESENVOLVIMENTO · candidaturas fictícias são gravadas no banco de teste</div><main class="access"><a class="brand" href="../">operum<span>data</span></a><h1>Teste sua candidatura.</h1><p>Formulário de integração separado das páginas públicas em revisão. Use apenas e-mail terminado em .test. Não é criada uma conta ou senha nesta etapa.</p><section class="card"><form id="apply"><label>Modalidade<select name="kind"><option value="remote_prospector">Prospecção remota</option><option value="affiliate">Afiliado</option></select></label><label>Nome fictício completo<input name="name" maxlength="120" required></label><label>E-mail fictício<input name="email" type="email" placeholder="pessoa@example.test" required></label><label>WhatsApp fictício<input name="whatsapp" inputmode="tel" required></label><div class="two"><label>Cidade fictícia<input name="city" required></label><label>UF<select name="uf" id="uf" required></select></label></div><section id="remote-fields"><label>Experiência principal<select name="experiencia_principal"><option value="televendas">Televendas</option><option value="telemarketing_ativo">Telemarketing ativo</option><option value="vendas_b2b">Vendas B2B</option><option value="agendamento_reunioes">Agendamento de reuniões</option><option value="outra">Outra</option></select></label><label>Tempo de experiência<select name="tempo_experiencia"><option value="menos_1">Menos de um ano</option><option value="1_3">De um a três anos</option><option value="3_5">De três a cinco anos</option><option value="mais_5">Mais de cinco anos</option></select></label><label>Possui equipamento para atuar remotamente?<select name="possui_equipamento"><option value="sim">Sim</option><option value="nao">Não</option></select></label></section><section id="affiliate-fields" hidden><label>Perfil profissional<input name="perfil_profissional"></label><label>Setores em que possui contatos (separados por vírgula)<input name="setores"></label></section><label class="checkbox"><input type="checkbox" name="consent" required>Concordo com o registro destes dados fictícios para teste de integração. Textos jurídicos definitivos ainda estão pendentes.</label><button>Enviar candidatura de teste</button></form><p id="application-result" role="status" aria-live="polite"></p></section><a href="./">Voltar ao acesso →</a></main></body></html>
